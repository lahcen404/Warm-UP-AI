services:

  postgres:
    image: postgres:17
    container_name: postgres_sql
    restart: always
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_sql
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: lahcen.maskour2003@gmail.com
      PGADMIN_DEFAULT_PASSWORD: lahcen123
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data: